name: CI/CD Pipeline (.jar)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 코드 가져오기
      - name: main 체크아웃
        uses: actions/checkout@v4

      # Java 21 설정
      - name: 자바 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # gradlew 권한 부여
      - name: gradlew 실행 권한 부여
        run: chmod +x ./backend/gradlew

      # Gradle 캐시 설정
      - name: gradle 세팅
        uses: gradle/actions/setup-gradle@v4

      # Spring Boot 빌드
      - name: gradle 빌드
        working-directory: ./backend
        run: ./gradlew build -x test

      # jar 업로드
      - name: 빌드된 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: BackEnd
          path: backend/build/libs/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # jar 다운로드
      - name: 아티팩트 다운로드
        uses: actions/download-artifact@v4
        with:
          name: BackEnd
          path: build/libs/

      # EC2 배포
      - name: EC2 배포
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          ENV: ${{ secrets.ENV }}

        run: |
          echo "$EC2_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem

          jar_file=$(find build/libs -name '*.jar' ! -name '*plain.jar' | head -n 1)

          # jar 전송
          scp -i private_key.pem \
              -o StrictHostKeyChecking=no \
              "$jar_file" \
              $EC2_USERNAME@$EC2_HOST:/home/$EC2_USERNAME/BackEnd.jar

          # .env 생성 및 서버 재시작
          ssh -i private_key.pem \
              -o StrictHostKeyChecking=no \
              $EC2_USERNAME@$EC2_HOST << EOF

            echo "$ENV" > /home/$EC2_USERNAME/.env

            PID=\$(pgrep -f BackEnd.jar)

            if [ -n "\$PID" ]; then
              kill -15 \$PID
              sleep 10
            fi

            nohup java -jar /home/$EC2_USERNAME/BackEnd.jar \
              > /home/$EC2_USERNAME/app.log 2>&1 &
          EOF

          rm -f private_key.pem